<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Lab</title>
    <meta name="description" content="Try, test and tune webcam hand gestures for the GODHAND gesture engine." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo">🧪</span><b>GESTURE LAB</b><span class="sub">gesture engine workbench</span></div>
      <nav class="tabs">
        <button data-tab="live" class="on">Live</button>
        <button data-tab="test">Test</button>
        <button data-tab="results">Results</button>
        <button data-tab="tune">Tune</button>
      </nav>
      <div class="status"><span id="st-dot" class="dot"></span><span id="st-text">camera off</span></div>
    </header>
    <main>
      <section class="stage">
        <div class="cam">
          <video id="cam" playsinline muted autoplay></video>
          <canvas id="overlay"></canvas>
          <div id="flash" class="flash"></div>
          <div id="prompt" class="prompt hidden"></div>
          <div id="start" class="start">
            <div class="big">🖐️</div>
            <h1>Gesture Lab</h1>
            <p>Every gesture the engine knows, live from your webcam. Video stays on your device.</p>
            <button id="b-start" class="primary">Start camera</button>
            <p id="start-err" class="err"></p>
          </div>
        </div>
        <div class="readout" id="readout"></div>
      </section>
      <aside class="panel">
        <div id="tab-live" class="tab on"></div>
        <div id="tab-test" class="tab"></div>
        <div id="tab-results" class="tab"></div>
        <div id="tab-tune" class="tab"></div>
      </aside>
    </main>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
